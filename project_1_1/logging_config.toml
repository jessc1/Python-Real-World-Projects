version = 1
disable_existing_loggers = false

[formatters.simple]
format = "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

[handlers.console]
class = "logging.StreamHandler"
level = "DEBUG"
formatter = "simple"
stream = "ext://sys.stdout"

[handlers.file]
class = "logging.handlers.RotatingFileHandler"
level = "INFO"
formatter = "simple"
filename = "app.log"
maxBytes = 10485760 # 10MB
backupCount = 5

[loggers.root]
level = "DEBUG"
handlers = ["console", "file"]

[loggers.my_module]
level = "INFO"
handlers = ["console"]
propagate = false
